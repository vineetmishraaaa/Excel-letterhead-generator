<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Letterhead Generator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app { width: 100%; max-width: 720px; }
        .header { text-align: center; margin-bottom: 22px; }
        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #172033;
            color: #fff;
            font-weight: 800;
            font-size: 20px;
        }
        h1 { margin: 0; font-size: 30px; letter-spacing: -0.7px; }
        .subtitle {
            margin: 9px auto 0;
            max-width: 560px;
            color: #697386;
            line-height: 1.5;
            font-size: 14px;
        }
        .card {
            background: #fff;
            border: 1px solid #e4e8ef;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 14px 36px rgba(20, 32, 55, .08);
        }
        .field { margin-bottom: 18px; }
        .label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }
        .file-box {
            border: 2px dashed #d7dde7;
            border-radius: 13px;
            padding: 17px;
            background: #fafbfc;
        }
        input[type=file] { width: 100%; font-size: 14px; }
        .hint { margin-top: 7px; color: #8b94a3; font-size: 12px; }
        button {
            width: 100%;
            border: 0;
            border-radius: 11px;
            padding: 14px;
            background: #172033;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: .65; cursor: wait; }
        .status {
            margin-top: 14px;
            padding: 11px 13px;
            border-radius: 10px;
            display: none;
            font-size: 13px;
            text-align: center;
            background: #f0f3f7;
        }
        .footer { margin-top: 14px; text-align: center; color: #969eac; font-size: 12px; }
        @media (max-width: 560px) {
            body { padding: 14px; }
            .card { padding: 18px; }
            h1 { font-size: 25px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">XP</div>
        <h1>Excel Letterhead Generator</h1>
        <p class="subtitle">
            Upload an Excel workbook and a letterhead PDF to create a ready-to-share PDF.
        </p>
    </div>

    <div class="card">
        <form id="uploadForm">
            <div class="field">
                <label class="label" for="excelFile">Excel workbook</label>
                <div class="file-box">
                    <input id="excelFile" name="excel_file" type="file" accept=".xlsx,.xls,.xlsm" required>
                    <div class="hint">.xlsx, .xls or .xlsm</div>
                </div>
            </div>

            <div class="field">
                <label class="label" for="letterheadFile">Letterhead PDF</label>
                <div class="file-box">
                    <input id="letterheadFile" name="letterhead" type="file" accept=".pdf" required>
                    <div class="hint">The first page is used as the letterhead template.</div>
                </div>
            </div>

            <button id="generateButton" type="submit">Generate PDF</button>
            <div id="status" class="status"></div>
        </form>
    </div>

    <div class="footer">Excel → PDF → Letterhead</div>
</div>

<script>
const form = document.getElementById('uploadForm');
const button = document.getElementById('generateButton');
const statusBox = document.getElementById('status');

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    button.disabled = true;
    button.textContent = 'Generating PDF...';
    statusBox.style.display = 'block';
    statusBox.textContent = 'Processing workbook. This may take a little while.';

    try {
        const response = await fetch('/upload', {
            method: 'POST',
            body: new FormData(form)
        });

        if (!response.ok) {
            let message = 'PDF generation failed.';
            try {
                const data = await response.json();
                if (data.error) message = data.error;
            } catch (_) {}
            throw new Error(message);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'final_letterhead.pdf';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        statusBox.textContent = 'Done. Your PDF has been downloaded.';
    } catch (error) {
        statusBox.textContent = error.message;
    } finally {
        button.disabled = false;
        button.textContent = 'Generate PDF';
    }
});
</script>
</body>
</html>
